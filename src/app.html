<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>تقويم زهرة</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>/* Layout: one-column phone app. Ring hero sits on the themed background; content in borderless soft-shadow cards
   grouped under small section labels; floating pill tab bar. Fonts unchanged: Reem Kufi (display) + IBM Plex Sans Arabic (body). */
:root{
  --bg:#FBF0F2; --surface:#FFFFFF; --ink:#24202B; --muted:#6C6677; --line:#EED9DF; --chip:#F5E6EA;
  --period:#C2304A; --period-soft:#F8DEE3; --predict:#E7A0AD; --fertile:#1F8A84; --fertile-soft:#D5EEEB; --ovu:#0E625E;
  --warn:#B86B00; --water:#3A86C8; --shadow:rgba(70,30,50,.10);
  --accent:var(--period); --accent-soft:var(--period-soft);
  --r:22px;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1216; --surface:#26191F; --ink:#EEEAF3; --muted:#A39CAE; --line:#432D37; --chip:#33222A;
  --period:#F0667D; --period-soft:#4A2330; --predict:#9A4C5C; --fertile:#4FC1B9; --fertile-soft:#163A38; --ovu:#86E2DA;
  --warn:#F0A64A; --water:#6AAEE8; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1216; --surface:#26191F; --ink:#EEEAF3; --muted:#A39CAE; --line:#432D37; --chip:#33222A;
  --period:#F0667D; --period-soft:#4A2330; --predict:#9A4C5C; --fertile:#4FC1B9; --fertile-soft:#163A38; --ovu:#86E2DA;
  --warn:#F0A64A; --water:#6AAEE8; --shadow:rgba(0,0,0,.45); color-scheme:dark}
:root[data-mode="preg"]{--accent:var(--fertile);--accent-soft:var(--fertile-soft)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.app{zoom:var(--zoom,1);max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(112px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
p{margin:0}
h1{font-family:var(--f-display);font-size:28px;margin:0;color:var(--accent);line-height:1.15;font-weight:700}
h2{font-family:var(--f-display);font-size:18px;margin:0;font-weight:500;text-wrap:balance;line-height:1.35}
h3{font-size:14px;margin:0;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px} .note{font-size:12px;color:var(--muted);line-height:1.6}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:4px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.today{color:var(--muted);font-size:12px}
.sec{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;padding-inline:6px;margin-bottom:-6px}

/* surfaces */
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:0 1px 2px var(--shadow),0 12px 32px -20px var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0;background:transparent;box-shadow:none}
.card.hero{background:transparent;box-shadow:none;padding:6px 0}
.inset{background:var(--bg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.banner{background:var(--surface);border-radius:16px;padding:8px 8px 8px 14px;padding-inline:14px 8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;box-shadow:0 1px 2px var(--shadow)}
.alert{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px;border-inline-start:4px solid var(--muted);box-shadow:0 1px 2px var(--shadow),0 10px 24px -20px var(--shadow)}
.alert.red{border-inline-start-color:var(--period)} .alert.teal{border-inline-start-color:var(--fertile)}
.alert>span{flex:1 1 14em;min-width:0}

/* controls */
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:11px 16px;background:var(--accent-soft);color:var(--accent);font-weight:600;line-height:1.3}
button.primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px -8px var(--accent)}
button.ghost{background:transparent;color:var(--accent);padding:6px 8px}
button.danger{background:transparent;color:var(--period);box-shadow:inset 0 0 0 1.5px var(--period)}
button:disabled{opacity:.45;cursor:default;box-shadow:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover){button:not(:disabled):hover{filter:brightness(.97)}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:11px 14px;width:100%;min-width:0}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
label.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:14px;padding:11px 16px;background:var(--accent-soft);color:var(--accent);flex:1 1 auto;text-align:center;display:block}
label.btn.primary-btn{background:var(--accent);color:#fff}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:99px;padding:4px;box-shadow:0 1px 2px var(--shadow)}
.seg button{border-radius:99px;padding:7px 14px;font-size:13px;background:transparent;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:99px;padding:7px 13px;font-size:13px;background:var(--bg);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none;font-weight:600}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:3px 10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-weight:600}
.tag.teal{background:var(--fertile-soft);color:var(--ovu)} .tag.red{background:var(--period-soft);color:var(--period)} .tag.warn{background:var(--chip);color:var(--warn)}
.x{background:transparent;color:var(--muted);padding:4px 8px;font-size:20px;line-height:1;font-weight:400}

/* hero ring + week strip */
.ring{width:100%;max-width:290px;aspect-ratio:1;display:block}
.ring text{font-family:var(--f-body)}
.status{font-family:var(--f-display);font-size:22px;line-height:1.3}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border-radius:var(--r);padding:12px 8px;box-shadow:0 1px 2px var(--shadow),0 12px 32px -20px var(--shadow)}
.wd2{background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:500;min-width:0}
.wd2 i{font-style:normal;width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--ink);background:var(--bg)}
.wd2 i.period{background:var(--period);color:#fff} .wd2 i.pred{background:transparent;box-shadow:inset 0 0 0 2px var(--predict);color:var(--period)}
.wd2 i.fertile{background:var(--fertile-soft);background:color-mix(in srgb,var(--fertile) var(--fp,30%),var(--surface));color:var(--ink)}
.wd2 i.ovu{background:var(--fertile);color:#fff} .wd2 i.now{outline:2.5px solid var(--ink);outline-offset:2px}

/* number tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:0 1px 2px var(--shadow),0 12px 32px -22px var(--shadow);border-inline-start:4px solid transparent}
.tile.good{border-inline-start-color:var(--fertile)} .tile.bad{border-inline-start-color:var(--period)}
.tile .k{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-size:21px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted)}
.tiles.three{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:480px){.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.fact{background:var(--surface);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:center;box-shadow:0 1px 2px var(--shadow)}
.card:not(.hero) .fact{background:var(--bg);box-shadow:none}
.fact b{font-size:15px;font-weight:600} .fact span{font-size:11px;color:var(--muted)}
.kv{display:flex;flex-direction:column;gap:2px;font-size:14px}
.kv span{color:var(--muted);font-size:13px}
.pats{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.method li{font-size:13px;color:var(--muted)}
.flagcard{border-inline-start:4px solid var(--period)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.wd{font-size:11px;color:var(--muted);font-weight:500}
.d{aspect-ratio:1;max-width:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0;background:transparent;color:var(--ink);font-weight:500;position:relative}
.d.out{visibility:hidden}
.d.period{background:var(--period);color:#fff;font-weight:600}
.d.pred{box-shadow:inset 0 0 0 2px var(--predict);color:var(--period)}
.d.fertile{background:var(--fertile-soft);background:color-mix(in srgb,var(--fertile) var(--fp,30%),var(--surface));color:var(--ink)}
.d.ovu{background:var(--fertile);color:#fff;font-weight:600}
.d.ovu.conf::before{content:"";position:absolute;inset:-3px;border-radius:50%;box-shadow:0 0 0 2px var(--fertile)}
.d.now{outline:2.5px solid var(--ink);outline-offset:-1px;font-weight:700}
.d.logged::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.d.sel{box-shadow:0 0 0 2.5px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px;vertical-align:-2px}

/* lists, bars, charts */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li>div{min-width:0}
.hbar{display:grid;grid-template-columns:7.5em 1fr 2em;gap:8px;align-items:center;font-size:13px}
.hbar .t{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.hbar .t>div{height:100%;background:var(--accent);border-radius:99px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body)}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar>div{height:100%;background:var(--fertile);border-radius:99px}
.heatwrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.heat{display:grid;grid-template-columns:minmax(6.5em,auto) repeat(18,minmax(13px,1fr));gap:3px;align-items:center;min-width:330px}
.hh{font-size:10px;color:var(--muted);text-align:center}
.hl{font-size:12px;white-space:nowrap;padding-inline-end:6px;overflow:hidden;text-overflow:ellipsis}
.hl.mood{color:var(--ovu)}
.hc{aspect-ratio:1;border-radius:4px;background:var(--chip);background:color-mix(in srgb,var(--accent) var(--h,0%),var(--chip))}
.hc.per{box-shadow:inset 0 -2px 0 var(--period-soft)}

/* pregnancy */
.baby{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.fruit{width:64px;height:64px;border-radius:50%;background:var(--fertile-soft);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:24px;color:var(--ovu)}
details.wk{border-bottom:1px solid var(--line)} details.wk:last-child{border-bottom:0}
details.wk summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:12px 2px;align-items:center}
details.wk summary::-webkit-details-marker,details.faq summary::-webkit-details-marker{display:none}
details.wk[open] summary{color:var(--accent)}
details.wk .body{padding:0 2px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
details summary{cursor:pointer}
.tap{width:min(220px,60vw);aspect-ratio:1;border-radius:50%;align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-display);font-size:22px;background:var(--accent);color:#fff;box-shadow:0 14px 30px -12px var(--accent)}
.tap b{font-size:52px;line-height:1}
.tap.off{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink);flex-direction:row}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.check:last-child{border-bottom:0}
.check.done span{color:var(--muted);text-decoration:line-through}
.drops{display:flex;gap:6px;flex-wrap:wrap}
.drop{width:20px;height:26px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--chip)}
.drop.on{background:var(--water)}
.big{font-family:var(--f-display);font-size:52px;line-height:1.1;color:var(--accent)}
.more-row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:transparent;color:var(--ink);padding:14px 2px;border-bottom:1px solid var(--line);border-radius:0;text-align:start;font-weight:400}
.more-row:last-child{border-bottom:0}
.more-row b{font-size:15px;font-weight:600}
details.faq{border-bottom:1px solid var(--line)} details.faq:last-child{border-bottom:0}
details.faq summary{padding:12px 2px;font-weight:600;list-style:none}
details.faq p{padding:0 2px 12px;font-size:14px}
details.faq[open] summary{color:var(--accent)}

/* lock, onboarding */
.lock{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.pins{display:flex;gap:16px}
.pins i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--accent)}
.pins i.on{background:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keypad button{height:72px;border-radius:50%;font-size:24px;background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px var(--shadow),0 8px 20px -14px var(--shadow)}
.ob{min-height:78vh;display:flex;flex-direction:column;gap:14px;justify-content:center}
.ob h1{font-size:30px}
.goal{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;padding:18px;border-radius:20px;background:var(--surface);color:var(--ink);font-weight:400;box-shadow:0 1px 2px var(--shadow),0 12px 32px -20px var(--shadow)}
.goal b{font-family:var(--f-display);font-size:19px;color:var(--accent);font-weight:500}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--accent)}

/* settings bits, media */
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.skin{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;font-size:13px;background:var(--bg);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.skin[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent);font-weight:600}
.sw{width:40px;height:40px;border-radius:50%;display:block}
.preview{display:flex;flex-direction:column;gap:6px}
.preview img{width:100%;max-width:320px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.15);align-self:center;background:#fff}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 14px;border-radius:18px;max-width:88%;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.msg.u{background:var(--accent);color:#fff;align-self:flex-end;border-end-end-radius:6px}
.msg.a{background:var(--bg);align-self:flex-start;border-end-start-radius:6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{padding:0;background:transparent;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block}
.phbig{margin:0;display:flex;flex-direction:column;gap:8px}
.phbig img{width:100%;max-height:70vh;object-fit:contain;border-radius:16px;background:var(--bg)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 10px;border-radius:18px;background:var(--bg);opacity:.7}
.badge.on{opacity:1;background:var(--accent-soft)}
.bico{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--chip);color:var(--muted)}
.badge.on .bico{background:var(--accent);color:#fff}
.bico svg{width:28px;height:28px}
.bprog{font-size:12px;font-weight:600;color:var(--accent)}
.cardimg{width:100%;max-width:360px;align-self:center;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}

const W={
1:['—','—',0,0,'يبدأ حساب الحمل من أول يوم في آخر دورة، فالإخصاب لم يحدث بعد.','Pregnancy is dated from the first day of your last period, so conception has not happened yet.','ابدئي حمض الفوليك إن لم تبدئيه، فهو يقلل خطر عيوب الأنبوب العصبي.','Start folic acid if you have not already. It lowers the risk of neural tube defects.'],
2:['—','—',0,0,'يحدث التبويض غالباً في نهاية هذا الأسبوع.','Ovulation usually happens at the end of this week.','نمط حياة صحي من الآن يفيد الحمل كله: نوم كافٍ وأكل متوازن.','Healthy habits now help the whole pregnancy: enough sleep and balanced meals.'],
3:['—','—',0,0,'يحدث الإخصاب وتتجه البويضة المخصبة نحو الرحم وهي تنقسم.','Fertilisation happens and the egg divides as it travels to the uterus.','لا توجد أعراض غالباً في هذا الأسبوع.','Most women have no symptoms yet.'],
4:['بذرة خشخاش','poppy seed',0,0,'تنغرس البويضة في جدار الرحم ويبدأ هرمون الحمل بالارتفاع.','The embryo implants in the uterine wall and the pregnancy hormone starts rising.','قد تلاحظين تأخر الدورة، واختبار الحمل المنزلي يصبح دقيقاً غالباً.','Your period may be late, and a home pregnancy test is usually reliable now.'],
5:['بذرة سمسم','sesame seed',0,0,'يبدأ تكوّن الأنبوب العصبي والقلب.','The neural tube and heart begin to form.','التعب وألم الثدي وكثرة التبول من الأعراض الشائعة.','Tiredness, sore breasts and needing to pee more are common.'],
6:['حبة عدس','lentil',0,0,'يبدأ القلب بالنبض ويمكن رؤيته بالسونار المهبلي غالباً.','The heart starts beating and can often be seen on a vaginal ultrasound.','الغثيان شائع. وجبات صغيرة متكررة تساعد.','Nausea is common. Small, frequent meals help.'],
7:['حبة توت','blueberry',1,0,'تظهر براعم الذراعين والساقين ويتطور الدماغ بسرعة.','Arm and leg buds appear and the brain grows quickly.','وقت مناسب لأول زيارة متابعة إن لم تحجزيها.','A good time for your first antenatal visit if it is not booked yet.'],
8:['حبة فاصوليا','kidney bean',1.6,1,'تبدأ الأصابع بالتشكّل ويتحرك الجنين حركات صغيرة لا تشعرين بها.','Fingers start to form and the baby makes tiny movements you cannot feel yet.','قد تزيد حساسيتك للروائح.','You may become more sensitive to smells.'],
9:['حبة عنب','grape',2.3,2,'تكتمل أغلب الأعضاء الأساسية في صورتها الأولى.','Most major organs are now in place in their early form.','اشربي ماء كافياً وقللي الكافيين.','Drink plenty of water and cut down on caffeine.'],
10:['تمرة','date',3.1,4,'انتهت أهم مرحلة في تكوين الأعضاء، ويبدأ النمو السريع.','The most critical stage of organ formation is over and rapid growth begins.','قد تلاحظين بداية بروز بسيط في البطن.','You may notice the first small bump.'],
11:['تينة','fig',4.1,7,'تتكون الأظافر وبصيلات الشعر.','Nails and hair follicles are forming.','فحص الشفافية القفوية يكون غالباً بين الأسبوع ١١ و١٤.','The nuchal translucency scan is usually done between weeks 11 and 14.'],
12:['ليمونة صغيرة','lime',5.4,14,'تبدأ الكلى بالعمل وتتطور ردود الفعل.','The kidneys start working and reflexes develop.','يبدأ الغثيان بالتحسن عند كثير من النساء.','Nausea starts to ease for many women.'],
13:['حبة مشمش','apricot',7.4,23,'تتكون بصمات الأصابع.','Fingerprints are forming.','نهاية الثلث الأول، ويقل خطر الإجهاض بوضوح.','The end of the first trimester. The risk of miscarriage drops clearly.'],
14:['ليمونة','lemon',8.7,43,'يستطيع الجنين تحريك عضلات وجهه.','The baby can move the muscles of the face.','بداية الثلث الثاني، وغالباً تعود الطاقة تدريجياً.','The second trimester begins and energy often comes back.'],
15:['تفاحة','apple',10.1,70,'تقوى العظام ويبدأ الجنين بالإحساس بالضوء.','Bones get stronger and the baby begins to sense light.','قد تلاحظين احتقان الأنف، وهو شائع في الحمل.','A stuffy nose is common in pregnancy.'],
16:['حبة أفوكادو','avocado',11.6,100,'يتطور الجهاز العصبي وتصبح حركة العينين أوضح.','The nervous system develops and eye movements become clearer.','بعض النساء يشعرن بأول حركة خفيفة من الآن، خاصة في الحمل الثاني.','Some women feel the first flutters now, especially in a second pregnancy.'],
17:['رمانة','pomegranate',13,140,'تبدأ الدهون بالتكوّن تحت الجلد.','Fat starts forming under the skin.','النوم على الجانب يصبح أريح مع كبر البطن.','Sleeping on your side gets more comfortable as the bump grows.'],
18:['فلفل رومي','bell pepper',14.2,190,'يتكوّن غلاف الأعصاب ويبدأ السمع بالتطور.','Nerves get their protective coating and hearing begins to develop.','السونار التفصيلي يكون غالباً بين الأسبوع ١٨ و٢٢.','The anomaly scan is usually done between weeks 18 and 22.'],
19:['مانجو','mango',15.3,240,'يغطي الجلد طلاء دهني أبيض يحميه.','A white, waxy coating forms to protect the skin.','قد تشعرين بألم خفيف في جانبي البطن بسبب تمدد الأربطة.','You may feel mild aches at the sides of your belly as ligaments stretch.'],
20:['موزة','banana',25.6,300,'منتصف الحمل. يبتلع الجنين السائل الأمنيوسي ويتدرب على الهضم.','Halfway there. The baby swallows amniotic fluid and practises digesting.','من هنا يُقاس طول الجنين من الرأس إلى القدم.','From now on the baby is measured head to heel.'],
21:['جزرة','carrot',26.7,360,'تصبح الحركات أوضح وأكثر انتظاماً.','Movements become stronger and more regular.','اهتمي بالحديد في أكلك أو حسب وصف الطبيبة.','Get enough iron from food or as your doctor prescribes.'],
22:['حبة بابايا','papaya',27.8,430,'تتطور الحواس، ويبدأ الجنين بالتقاط أصوات من الخارج.','The senses develop and the baby starts picking up outside sounds.','قد تظهر علامات تمدد على البطن، وهي شائعة جداً.','Stretch marks may appear. They are very common.'],
23:['جريب فروت','grapefruit',28.9,500,'يتعرف الجنين على صوتك ويستجيب للأصوات العالية.','The baby recognises your voice and reacts to loud sounds.','تورم القدمين الخفيف طبيعي، ارفعيهما عند الراحة.','Mild swelling of the feet is normal. Raise them when you rest.'],
24:['كوز ذرة','ear of corn',30,600,'تتطور الرئتان وتبدأ بإنتاج مادة تساعدها على التنفس لاحقاً.','The lungs develop and start making a substance that helps breathing later.','فحص سكر الحمل يكون غالباً بين الأسبوع ٢٤ و٢٨.','The gestational diabetes test is usually done between weeks 24 and 28.'],
25:['قرنبيط','cauliflower',34.6,660,'يمتلئ الجسم أكثر ويزداد الوزن.','The body fills out and weight increases.','قد تلاحظين حرقة المعدة. وجبات صغيرة وتجنب الاستلقاء بعد الأكل.','Heartburn is common. Eat small meals and avoid lying down after eating.'],
26:['خسة','lettuce',35.6,760,'تبدأ العينان بالانفتاح.','The eyes begin to open.','ارتفاع ضغط مفاجئ أو صداع شديد يستدعي مراجعة الطبيبة.','A sudden rise in blood pressure or a severe headache needs a doctor.'],
27:['ملفوف صغير','small cabbage',36.6,875,'ينام ويستيقظ بنمط أكثر انتظاماً.','The baby sleeps and wakes in a more regular pattern.','آخر أسبوع في الثلث الثاني.','The last week of the second trimester.'],
28:['باذنجانة كبيرة','large eggplant',37.6,1000,'يستطيع الجنين أن يرمش، والدماغ يتطور بسرعة.','The baby can blink, and the brain is growing fast.','بداية الثلث الثالث. ابدئي عدّ الحركات يومياً.','The third trimester begins. Start counting kicks every day.'],
29:['قرع صغير','butternut squash',38.6,1150,'تقوى العظام ويحتاج الجنين كالسيوم أكثر.','Bones get stronger and the baby needs more calcium.','قد تزيد زيارات المتابعة إلى مرة كل أسبوعين.','Check-ups may now be every two weeks.'],
30:['ملفوف','cabbage',39.9,1300,'يتحكم الدماغ في حرارة الجسم بشكل أفضل.','The brain gets better at controlling body temperature.','ضيق النفس الخفيف شائع مع ضغط الرحم على الحجاب الحاجز.','Mild breathlessness is common as the uterus presses on the diaphragm.'],
31:['جوز هند','coconut',41.1,1500,'تعمل الحواس الخمس كلها.','All five senses are working.','انقباضات خفيفة غير منتظمة (براكستون هيكس) قد تظهر الآن.','Mild, irregular practice contractions (Braxton Hicks) may start.'],
32:['أناناس','pineapple',42.4,1700,'يتخذ الجنين غالباً وضعية الرأس للأسفل.','The baby usually turns head down.','تابعي الحركة يومياً، وقلة الحركة الواضحة تستدعي التواصل مع الطبيبة.','Track movements daily. A clear drop in movement means calling your doctor.'],
33:['أناناس كبير','large pineapple',43.7,1900,'تتصلب العظام عدا الجمجمة التي تبقى لينة لتسهيل الولادة.','Bones harden, except the skull, which stays soft for birth.','خططي لطريقة الوصول إلى المستشفى.','Plan how you will get to the hospital.'],
34:['شمام','cantaloupe',45,2150,'الرئتان قريبتان من الاكتمال.','The lungs are nearly mature.','وقت مناسب لمراجعة خطة الولادة مع الطبيبة.','A good time to go over your birth plan with your doctor.'],
35:['شمام كبير','honeydew melon',46.2,2400,'يكسب الجنين نحو ٢٠٠ جرام في الأسبوع.','The baby gains about 200 g a week.','فحص بكتيريا المجموعة ب يكون غالباً بين الأسبوع ٣٥ و٣٧.','The Group B strep test is usually done between weeks 35 and 37.'],
36:['خسة رومين','romaine lettuce',47.4,2600,'ينزل الجنين نحو الحوض استعداداً للولادة.','The baby drops lower into the pelvis to get ready for birth.','جهّزي شنطة الولادة إن لم تجهزيها.','Pack your hospital bag if you have not yet.'],
37:['شمّامة كبيرة','winter melon',48.6,2850,'حمل مكتمل مبكر. يتدرب على التنفس والمص.','Early term. The baby practises breathing and sucking.','تعرّفي على علامات الولادة: طلق منتظم، نزول الماء، أو نزيف.','Know the signs of labour: regular contractions, waters breaking, or bleeding.'],
38:['قرعة','pumpkin',49.8,3100,'الأعضاء جاهزة للحياة خارج الرحم.','The organs are ready for life outside the womb.','استريحي قدر ما تستطيعين.','Rest as much as you can.'],
39:['بطيخة صغيرة','small watermelon',50.7,3300,'حمل مكتمل. يستمر تراكم الدهون.','Full term. The baby keeps adding fat.','استخدمي مؤقت الطلق لمعرفة متى تتوجهين للمستشفى.','Use the contraction timer to know when to head to hospital.'],
40:['بطيخة','watermelon',51.2,3450,'موعد الولادة المتوقع، وقليل من المواليد يولدون في هذا اليوم بالضبط.','Your due date. Few babies arrive on this exact day.','إذا تجاوزتِ الموعد، ستتابع الطبيبة حالتك عن قرب.','If you go past it, your doctor will monitor you closely.'],
41:['بطيخة','watermelon',51.5,3600,'تجاوز موعد الولادة.','Past your due date.','المتابعة الطبية القريبة مهمة في هذا الأسبوع.','Close medical follow-up matters this week.']};

const LIB={
cycle:[
['ما الدورة الطبيعية؟','طول الدورة الطبيعي من ٢١ إلى ٣٥ يوماً، ومدة النزول من يومين إلى ٧ أيام. الاختلاف البسيط من شهر لآخر طبيعي.','What is a normal cycle?','A normal cycle is 21 to 35 days, with bleeding for 2 to 7 days. Small changes from month to month are normal.'],
['كيف أعرف موعد التبويض؟','يحدث التبويض غالباً قبل الدورة القادمة بنحو ١٤ يوماً. علاماته: إفرازات شفافة مطاطية مثل بياض البيض، واختبار تبويض إيجابي، وارتفاع حرارة الجسم الأساسية بنحو ٠٫٣ درجة بعده.','How do I know when I ovulate?','Ovulation usually happens about 14 days before your next period. Signs include clear, stretchy discharge like egg white, a positive ovulation test, and a rise of about 0.3°C in resting temperature afterwards.'],
['ما أفضل أيام الحمل؟','الأيام الخمسة قبل التبويض ويوم التبويض نفسه. أعلى فرصة في اليومين السابقين للتبويض.','When am I most likely to conceive?','The five days before ovulation and ovulation day itself. The highest chance is the two days before ovulation.'],
['كيف أخفف التقلصات؟','كمادة دافئة على البطن، وحركة خفيفة مثل المشي، وشرب الماء. المسكنات مثل الإيبوبروفين تفيد كثيرات، مع الالتزام بالنشرة.','How can I ease cramps?','A warm pack on your belly, gentle movement such as walking, and water. Pain relief such as ibuprofen helps many women; follow the leaflet.'],
['متى أراجع الطبيبة؟','إذا كان النزيف يملأ فوطة كل ساعة لعدة ساعات، أو الدورة أقصر من ٢١ يوماً أو أطول من ٣٥ باستمرار، أو غابت ٣ أشهر دون حمل، أو كان الألم شديداً لا يخففه المسكن، أو ظهر نزيف بين الدورات.','When should I see a doctor?','If you soak a pad every hour for several hours, your cycles are regularly shorter than 21 or longer than 35 days, you miss 3 periods without being pregnant, pain is severe despite pain relief, or you bleed between periods.'],
['ما أعراض ما قبل الدورة؟','انتفاخ، وألم الثدي، وتقلب المزاج، والرغبة في الأكل، والتعب. تبدأ غالباً قبل الدورة بأسبوع وتخف مع بدايتها.','What are PMS symptoms?','Bloating, tender breasts, mood swings, cravings and tiredness. They usually start about a week before your period and ease when it begins.'],
['هل التطبيق وسيلة لمنع الحمل؟','لا. التوقعات مبنية على متوسط دوراتك وقد يتغير التبويض من شهر لآخر. لمنع الحمل استشيري الطبيبة عن وسيلة مناسبة.','Can I use this app as contraception?','No. Predictions are based on your average cycle and ovulation can shift from month to month. Ask your doctor about a suitable method.']],
preg:[
['متى أذهب للطوارئ فوراً؟','نزيف مهبلي، أو نزول ماء، أو ألم شديد في البطن، أو صداع شديد مع زغللة أو تورم مفاجئ في الوجه واليدين، أو قلة واضحة في حركة الجنين، أو حرارة مرتفعة.','When should I go to the emergency room?','Vaginal bleeding, waters breaking, severe belly pain, a severe headache with blurred vision or sudden swelling of the face and hands, a clear drop in baby movements, or a high fever.'],
['ما أهم الفيتامينات؟','حمض الفوليك قبل الحمل وفي الثلث الأول، والحديد، والكالسيوم، وفيتامين د. الجرعات تحددها الطبيبة.','Which vitamins matter most?','Folic acid before and in the first trimester, plus iron, calcium and vitamin D. Your doctor sets the doses.'],
['ما الأطعمة التي أتجنبها؟','اللحوم والبيض غير المطهوة جيداً، والأجبان والألبان غير المبسترة، والأسماك عالية الزئبق مثل سمك القرش وأبو سيف. وخففي الكافيين إلى نحو ٢٠٠ ملغ يومياً.','Which foods should I avoid?','Undercooked meat and eggs, unpasteurised cheese and dairy, and high-mercury fish such as shark and swordfish. Keep caffeine to about 200 mg a day.'],
['هل أصوم رمضان وأنا حامل؟','يعتمد على صحتك ومرحلة الحمل. ناقشي الأمر مع الطبيبة قبل رمضان، وإذا صمتِ فأفطري فوراً عند الدوخة أو العطش الشديد أو قلة حركة الجنين.','Can I fast in Ramadan while pregnant?','It depends on your health and stage of pregnancy. Talk to your doctor before Ramadan, and if you fast, break it at once if you feel dizzy, very thirsty, or the baby moves less.'],
['ما الرياضة المناسبة؟','المشي والسباحة واليوغا الخاصة بالحوامل نحو ٣٠ دقيقة في أغلب الأيام، إذا لم تمنعك الطبيبة.','What exercise is safe?','Walking, swimming and pregnancy yoga for about 30 minutes on most days, unless your doctor advises otherwise.'],
['كيف أنام براحة؟','النوم على الجانب، خاصة الأيسر في الثلث الثالث، مع وسادة بين الركبتين.','How can I sleep better?','Sleep on your side, especially the left in the third trimester, with a pillow between your knees.'],
['ما علامات الولادة؟','طلق منتظم يزداد قوة ويتقارب، ونزول السدادة المخاطية، ونزول الماء. قاعدة ٥-١-١: طلق كل ٥ دقائق يستمر دقيقة لمدة ساعة، وقتها توجهي للمستشفى.','What are the signs of labour?','Regular contractions that get stronger and closer, losing the mucus plug, and waters breaking. The 5-1-1 rule: contractions every 5 minutes, lasting 1 minute, for 1 hour means it is time to go in.'],
['ما اكتئاب ما بعد الولادة؟','حزن وبكاء في الأيام الأولى بعد الولادة شائع ويخف خلال أسبوعين. إذا استمر الحزن أو فقدتِ الاهتمام بكل شيء، كلّمي طبيبتك، فهو حالة شائعة لها علاج.','What is postnatal depression?','Feeling low and tearful in the first days after birth is common and passes within two weeks. If it lasts or you lose interest in everything, talk to your doctor. It is common and treatable.']]};

/* ---------- AI assistant (uses the page's `sample` capability) ---------- */
let SAMPLE=null;try{window.claude?.use?.('sample')?.then(x=>{SAMPLE=x;if(U&&U.more==='ai')render()}).catch(()=>{})}catch(e){}
function aiContext(){
  if(S.mode==='preg'&&S.preg.lmp){const p=preg();return LI()?`Pregnant, week ${p.w} + ${p.d} days, ${triName(p.tri)}.`:`حامل في الأسبوع ${p.w} و${p.d} أيام، ${triName(p.tri)}.`}
  const c=current(buildMap());if(!c)return LI()?'No cycle data logged yet.':'لم تسجّل بيانات دورة بعد.';
  return LI()?`Cycle day ${c.day}, average cycle ${avgCycle()} days, phase: ${c.phase}${c.late>0?`, period ${c.late} days late`:''}. Goal: ${S.goal==='ttc'?'trying to conceive':'tracking her cycle'}.`
    :`اليوم ${c.day} من الدورة، متوسط الدورة ${avgCycle()} يوماً، المرحلة: ${c.phase}${c.late>0?`، الدورة متأخرة ${c.late} أيام`:''}. الهدف: ${S.goal==='ttc'?'تحاول الحمل':'تتبع الدورة'}.`;
}
const fmtMsg=s=>esc(s).replace(/\n/g,'<br>');
function vAi(){
  const ch=U.decoy?[]:(S.chat||[]),qs=S.mode==='preg'?['aiQ4','aiQ5','aiQ6']:['aiQ1','aiQ2','aiQ3'];
  const msgs=ch.map(m=>`<div class="msg ${m.r}">${fmtMsg(m.t)}</div>`).join('')+(U.aiBusy?`<div class="msg a" id="ai-live">${esc(U.aiLive||t('aiThinking'))}</div>`:'');
  return back()+`<section class="card"><div class="card-h"><h2>${t('mAi')}</h2>${ch.length?`<button class="ghost" data-act="aiClear">${t('aiClear')}</button>`:''}</div>
    ${SAMPLE?'':`<div class="alert"><span>${t('aiNA')}</span></div>`}
    <div class="chat">${ch.length||U.aiBusy?msgs:`<div class="msg a">${t('aiIntro')}</div>`}</div>
    ${!ch.length&&!U.aiBusy?`<div class="chips">${qs.map(q=>`<button class="chip" data-act="aiAsk" data-q="${esc(t(q))}">${t(q)}</button>`).join('')}</div>`:''}

/* ===== cycle calculations ===== */
const sorted=()=>[...S.periods].sort((a,b)=>a.start<b.start?-1:1);
const pEnd=p=>p.end||add(p.start,S.settings.periodLen-1);
function gaps(){const ps=sorted(),g=[];for(let i=1;i<ps.length;i++)g.push({start:ps[i-1].start,len:diff(ps[i-1].start,ps[i].start)});return g.filter(x=>x.len>=15&&x.len<=60)}
function avgCycle(){const v=gaps().slice(-6).map(x=>x.len);return v.length?Math.round(mean(v)):S.settings.cycleLen}
function avgPeriod(){const v=sorted().filter(p=>p.end).map(p=>diff(p.start,p.end)+1).filter(x=>x>=1&&x<=12).slice(-6);return v.length?Math.round(mean(v)):S.settings.periodLen}
function buildMap(){
  const m=new Map(),ps=sorted(),avg=avgCycle(),plen=avgPeriod(),starts=ps.map(p=>p.start);
  if(ps.length){let next=add(starts[starts.length-1],avg);while(next<=TODAY)next=add(next,avg);for(let k=0;k<6;k++){starts.push(next);next=add(next,avg)}}
  for(let i=1;i<starts.length;i++){const ov=add(starts[i],-14);for(let j=-5;j<=1;j++)m.set(add(ov,j),'fertile');m.set(ov,'ovu')}
  for(let i=ps.length;i<starts.length;i++)for(let j=0;j<plen;j++)m.set(add(starts[i],j),'pred');
  for(const p of ps){const e=pEnd(p);for(let d=p.start;d<=e;d=add(d,1))m.set(d,'period')}
  return {m,starts,future:starts.slice(ps.length),avg,plen};
}
function current(info){
  const ps=sorted().filter(p=>p.start<=TODAY);if(!ps.length)return null;
  const lastP=ps[ps.length-1],last=lastP.start,day=diff(last,TODAY)+1;
  const late=diff(add(last,info.avg),TODAY),next=info.future[0],ov=next?add(next,-14):null;
  const type=info.m.get(TODAY),nov=info.future.map(s=>add(s,-14)).find(o=>o>=TODAY);
  let ph;
  if(type==='period')ph='phPeriod';else if(type==='ovu'||type==='fertile')ph='phFert';
  else if(ov&&TODAY<add(ov,-5)&&late<=0)ph='phFoll';else if(late>0)ph='phLate';
  else ph=next&&diff(TODAY,next)<=5?'phPms':'phLut';
  const chance=type==='ovu'?['chHighest','teal']:type==='fertile'?['chHigh','teal']:['chLow','red'];
  return {last,lastP,day,late,next,ov,nov,type,phase:t(ph),desc:t(ph+'D'),chance:[t(chance[0]),chance[1]]};
}

/* ===== CYCLE MODE ===== */
function ringCycle(c,info){
  const total=Math.max(info.avg,c.day),cx=140,cy=140,r=112,parts=[];
  for(let i=1;i<=total;i++){
    const a=-Math.PI/2+((i-1)/total)*Math.PI*2*(LI()?1:1),tp=info.m.get(add(c.last,i-1));
    const col=tp==='period'?'var(--period)':tp==='ovu'?'var(--fertile)':tp==='fertile'?'var(--fertile-soft)':tp==='pred'?'var(--predict)':'var(--line)';
    const now=i===c.day,x=(cx+r*Math.cos(a)).toFixed(1),y=(cy+r*Math.sin(a)).toFixed(1);
    if(now)parts.push(`<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="var(--ink)" stroke-width="2"/>`);
    parts.push(`<circle cx="${x}" cy="${y}" r="${now?9:6.5}" fill="${col}"/>`);
  }
  return `<svg class="ring" viewBox="0 0 280 280" role="img" aria-label="${t('ringAria',c.day)}">${parts.join('')}
    <text x="140" y="112" text-anchor="middle" font-size="14" fill="var(--muted)">${t('ringDay')}</text>
    <text x="140" y="162" text-anchor="middle" font-size="56" font-weight="600" fill="var(--ink)">${c.day}</text>
    <text x="140" y="190" text-anchor="middle" font-size="13" fill="var(--muted)">${t('ringOf')}</text></svg>`;
}
function statusLine(c){
  if(c.type==='period')return t('stPeriod');if(c.late>0)return t('stLate',c.late);
  if(c.type==='ovu')return t('stOvu');if(c.type==='fertile')return t('stFert');
  if(c.next){const n=diff(TODAY,c.next);return n===0?t('stToday'):t('stIn',n)}return '';
}
function predSpread(){const v=gaps().slice(-6).map(x=>x.len);return v.length>=2?Math.min(5,Math.max(1,Math.ceil((Math.max(...v)-Math.min(...v))/2))):2}
function rangeLine(c){if(!c.next||c.late>0)return '';const sp=predSpread();return `<div class="note">${t('range',fmt(add(c.next,-sp)),fmt(add(c.next,sp)))}</div>`}

function barChart(g,avg){
  const Wd=320,Hd=170,pl=8,pr=8,pt=22,pb=26,mx=Math.max(...g.map(x=>x.len)),top=Math.max(40,mx+4),bw=(Wd-pl-pr)/g.length,ys=v=>pt+(Hd-pt-pb)*(1-v/top);
  const seq=LI()?g:[...g].reverse(); // oldest on the reading-start side
  let s=seq.map((x,i)=>{const bx=pl+i*bw+bw*.2,w=bw*.6,y=ys(x.len);
    return `<rect x="${bx}" y="${y}" width="${w}" height="${Hd-pb-y}" rx="5" fill="var(--period)"/><text x="${bx+w/2}" y="${y-6}" text-anchor="middle" font-size="12" fill="var(--ink)">${x.len}</text>
    <text x="${bx+w/2}" y="${Hd-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${new Intl.DateTimeFormat(LOC(),{month:'short'}).format(pd(x.start))}</text>`}).join('');
  const ay=ys(avg);
  return s+`<line x1="${pl}" x2="${Wd-pr}" y1="${ay}" y2="${ay}" stroke="var(--fertile)" stroke-dasharray="4 4" stroke-width="1.5"/><line x1="${pl}" x2="${Wd-pr}" y1="${Hd-pb}" y2="${Hd-pb}" stroke="var(--line)"/>`;
}

  const lang=`<div class="seg" style="align-self:flex-start"><button data-lang="ar" aria-pressed="${!LI()}" lang="ar">العربية</button><button data-lang="en" aria-pressed="${!!LI()}" lang="en">English</button></div>`;
  const G=(k,d)=>`<button class="goal" data-obgoal="${k}"><b>${t(k==='track'?'goalTrack':k==='ttc'?'goalTtc':'imPreg')}</b><span class="small muted">${t(d)}</span></button>`;
  if(o.step===1)return `<div class="ob">${lang}${st}<h1>${t('obHi')}</h1><p class="muted">${t('obPick')}</p>${G('track','obTrackD')}${G('ttc','obTtcD')}${G('preg','obPregD')}
    ${S.sampleCycle||S.samplePreg?`<button class="ghost" data-act="obCancel">${t('obBackSample')}</button>`:''}</div>`;
  if(o.step===2)return `<div class="ob">${st}<h2>${t('obName')}</h2><label for="obname">${t('obNameL')}<input id="obname" value="${esc(o.name||'')}" maxlength="30"></label>
    <div class="row"><button class="primary" data-act="obNext">${t('nextBtn')}</button><button data-act="obBack">${t('back')}</button></div></div>`;
  if(o.goal==='preg')return `<div class="ob">${st}<h2>${t('obPregQ')}</h2><label for="oblmp">${t('lmpLabel')}<input type="date" id="oblmp" max="${TODAY}"></label>
    <label for="obdue">${t('obDueL')}<input type="date" id="obdue" min="${TODAY}"></label><p class="note" style="color:var(--period)">${esc(U.msg)}</p>
    <div class="row"><button class="primary" data-act="obDone">${t('start')}</button><button data-act="obBack">${t('back')}</button></div></div>`;
  return `<div class="ob">${st}<h2>${t('obLastQ')}</h2><label for="oblast">${t('lmpLabel')}<input type="date" id="oblast" max="${TODAY}"></label>

/* ===== statistical cycle engine =====
   - cycle length: exponentially weighted mean of the last 12 cycles after removing outliers (median ± 3·MAD),
     shrunk toward the user's usual length when few cycles are logged (Bayesian-style, prior weight 2 cycles)
   - next period: discrete normal distribution, conditioned on "not started before today"; median + 80% interval
   - ovulation: next start − personal luteal length (from cycles with LH+ or a BBT 3-over-6 shift), else 14 ± 1.6
   - fertility: Wilcox et al. (NEJM 1995) day-specific conception probabilities convolved with ovulation uncertainty
   - regularity/frequency: FIGO 2018 limits; accuracy: rolling back-test; trend: least-squares slope */
const WIL={'-5':.10,'-4':.16,'-3':.14,'-2':.27,'-1':.31,'0':.33};
const median=a=>{if(!a.length)return NaN;const s=[...a].sort((x,y)=>x-y),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2};
const sdOf=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const k=1/(1+.3275911*x);return s*(1-((((1.061405429*k-1.453152027)*k+1.421413741)*k-.284496736)*k+.254829592)*k*Math.exp(-x*x))}
const Phi=z=>.5*(1+erf(z/Math.SQRT2));
function cyclesAll(){const ps=sorted(),o=[];for(let i=1;i<ps.length;i++){const a=ps[i-1],b=ps[i];o.push({start:a.start,end:b.start,len:diff(a.start,b.start),excl:!!a.excl,bleed:diff(a.start,pEnd(a))+1})}return o}
function robust(lens){
  if(!lens.length)return null;
  const med=median(lens),mad=median(lens.map(x=>Math.abs(x-med)))*1.4826,thr=Math.max(3*mad,5);
  const keep=lens.map(x=>Math.abs(x-med)<=thr),L=lens.filter((x,i)=>keep[i]);
  let ws=0,s=0,v=0;L.forEach((x,i)=>{const w=Math.pow(.85,L.length-1-i);ws+=w;s+=w*x});const mu=s/ws;
  L.forEach((x,i)=>{const w=Math.pow(.85,L.length-1-i);v+=w*(x-mu)**2});
  return {mu,sd:L.length>1?Math.sqrt(v/ws*L.length/(L.length-1)):NaN,med,mad,keep,L};
}
/* ovulation confirmed inside [start, end): LH positive → next day; BBT 3-over-6 rule → day before the shift */
function confirmOvu(start,end){
  const ds=Object.keys(S.logs).filter(d=>d>=start&&(!end||d<end)&&d<=TODAY).sort();
  let lh=null;for(const d of ds)if(S.logs[d].lh==='pos'){lh=add(d,1);break}
  const tp=ds.filter(d=>S.logs[d].bbt).map(d=>[d,S.logs[d].bbt]);let bb=null;
  for(let i=6;i+2<tp.length;i++){const base=Math.max(...tp.slice(i-6,i).map(x=>x[1]));if(tp[i][1]>base&&tp[i+1][1]>base&&tp[i+2][1]>=base+.2){bb=add(tp[i][0],-1);break}}
  if(lh&&bb)return Math.abs(diff(lh,bb))<=3?add(lh,Math.round(diff(lh,bb)/2)):lh;
  return lh||bb;
}
let MC={k:null,v:null};
function model(){
  const key=JSON.stringify(S.periods)+JSON.stringify(S.settings)+Object.entries(S.logs).filter(([,l])=>l.lh||l.bbt).map(([d,l])=>d+(l.lh||'')+(l.bbt||'')).join()+TODAY;
  if(MC.k===key)return MC.v;
  const all=cyclesAll(),valid=all.filter(c=>!c.excl&&c.len>=15&&c.len<=90),recent=valid.slice(-12),lens=recent.map(c=>c.len),r=robust(lens);
  const n=r?r.L.length:0,prior=S.settings.cycleLen,PS=3,K=2;
  let mu=prior,sd=PS;
  if(n){mu=(n*r.mu+K*prior)/(n+K);sd=n>=2?Math.sqrt(((n-1)*r.sd**2+K*PS**2)/(n-1+K)):PS}
  if(n>=6){mu=r.mu;sd=r.sd}           // enough history: trust the data alone
  sd=Math.max(sd,1);
  const luts=[];all.forEach(c=>{if(c.excl)return;const o=confirmOvu(c.start,c.end);if(o){const L=diff(o,c.end);if(L>=7&&L<=19)luts.push(L)}});
  const Lm=luts.length?clamp(Math.round(median(luts)),9,17):14,Ls=luts.length>=2?clamp(sdOf(luts),.8,3):1.6;
  const ps=sorted(),lastP=ps[ps.length-1];
  const bl=ps.filter(p=>p.end).map(p=>diff(p.start,p.end)+1).filter(x=>x>=1&&x<=15).slice(-6);
  const plen=bl.length?Math.round(median(bl)):S.settings.periodLen,bleed=bl.length?mean(bl):null;
  const M={n,mu,sd,lens,all,valid,recent,r,Lm,Ls,luts,plen,bleed,outliers:r?lens.filter((x,i)=>!r.keep[i]):[],range:0};
  if(lens.length){M.min=Math.min(...lens);M.max=Math.max(...lens);M.range=M.max-M.min;M.cv=sd/mu}
  if(lastP){

/* ---------- panel rings ---------- */
function ringCycle(c,info){
  const M=info.M,total=Math.max(Math.round(M.c0||info.avg),c.day),cx=150,cy=150,r=116,parts=[],g=total>40?.4:.9;
  for(let i=1;i<=total;i++){
    const d=add(c.last,i-1),tp=info.m.get(d),p=info.P.get(d)||0,a0=-90+(i-1)/total*360+g,a1=-90+i/total*360-g;
    let col='rgba(255,255,255,.2)',op=1;
    if(tp==='period')col='#fff';else if(tp==='pred')col='rgba(255,255,255,.6)';else if(tp==='ovu')col='var(--gold)';else if(p>=.02){col='var(--gold)';op=(.3+.7*Math.min(1,p/.33)).toFixed(2)}
    parts.push(`<path d="${arcP(cx,cy,r,a0,a1)}" stroke="${col}" stroke-opacity="${op}" stroke-width="22" fill="none" stroke-linecap="butt"/>`);
  }
  const am=(-90+(c.day-.5)/total*360)*Math.PI/180,mx=(cx+r*Math.cos(am)).toFixed(1),my=(cy+r*Math.sin(am)).toFixed(1);
  parts.push(`<circle cx="${mx}" cy="${my}" r="17" fill="#fff"/><circle cx="${mx}" cy="${my}" r="7" fill="var(--accent)"/>`);
  return `<svg class="ring" viewBox="0 0 300 300" role="img" aria-label="${t('ringAria',c.day)}">${parts.join('')}
    <text x="150" y="120" text-anchor="middle" font-size="15" fill="rgba(255,255,255,.85)">${t('ringDay')}</text>
    <text x="150" y="180" text-anchor="middle" font-size="70" font-weight="600" fill="#fff">${c.day}</text>
    <text x="150" y="208" text-anchor="middle" font-size="14" fill="rgba(255,255,255,.85)">${t('ringSub',Math.round(M.c0||info.avg))}</text></svg>`;
}

const NDEF={on:false,period:true,fert:true,late:true,meds:true,medTime:'09:00',water:false,journal:false,journalTime:'21:00',week:true,appt:true,kicks:true,kickTime:'19:00',vacc:true,feed:false,feedGap:3,ramadan:true,hide:false};
const NS=()=>(S.notif=Object.assign({},NDEF,S.notif||{}));
const accentHex=()=>((SKINS.find(s=>s[0]===S.skin)||SKINS[0])[S.mode==='preg'?4:3]);
const atT=(d,tm)=>{const [h,m]=String(tm||'09:00').split(':').map(Number),x=pd(d);x.setHours(h||0,m||0,0,0);return x};
function buildNotifs(){
  const n=NS(),out=[],now=Date.now(),lim=now+70*DAY;
  const push=(id,when,title,body,extra={})=>{const ts=+when;if(!(ts>now+60e3&&ts<lim))return;
    out.push({id,title:n.hide?t('nGenT'):title,body:n.hide?t('nGenB'):body,schedule:{at:new Date(ts),allowWhileIdle:true},channelId:'zahra',smallIcon:'ic_stat_zahra',iconColor:accentHex(),extra})};
  if(S.mode==='cycle'&&S.periods.length&&!S.sampleCycle){
    const info=buildMap(),M=info.M;
    info.future.slice(0,3).forEach((s,k)=>{
      if(n.period){push(1000+k*2,atT(add(s,-2),'09:00'),t('nPerT'),t('nPer2'),{mode:'cycle',tab:'home'});push(1001+k*2,atT(s,'09:00'),t('nPerT'),t('nPer0'),{mode:'cycle',tab:'home'})}
      if(n.fert&&S.goal==='ttc'){let f=null,o=null;for(let i=-26;i<0;i++){const d=add(s,i);if(!f&&(info.P.get(d)||0)>=.05)f=d;if(info.m.get(d)==='ovu')o=d}
        if(f)push(1100+k*2,atT(f,'09:00'),t('nFertT'),t('nFertB'),{mode:'cycle',tab:'home'});if(o)push(1101+k*2,atT(o,'09:00'),t('nFertT'),t('nOvuB'),{mode:'cycle',tab:'home'})}
    });
    if(n.late&&M.nominal)push(1200,atT(add(M.nominal,3),'10:00'),t('nLateT'),t('nLateB'),{mode:'cycle',tab:'home'});
  }
  for(let i=0;i<14;i++){const d=add(TODAY,i);
    if(n.meds&&S.habits.meds.length)push(2000+i,atT(d,n.medTime),t('nMedT'),S.habits.meds.map(m=>m.name).join(LI()?', ':'، '),{tab:'home'});
    if(n.water)['11:00','14:00','17:00','20:00'].forEach((tm,j)=>push(2100+i*4+j,atT(d,tm),t('nWaterT'),t('nWaterB'),{tab:'home'}));
    if(n.journal&&S.mode==='cycle')push(2200+i,atT(d,n.journalTime),t('nJourT'),t('nJourB'),{mode:'cycle',tab:'log'});
  }
  if(S.mode==='preg'&&S.preg.lmp&&!S.samplePreg){const p=preg();
    if(n.week)for(let w=p.w+1;w<=Math.min(41,p.w+10);w++){const i=wk(W[w]);push(3000+w,atT(add(S.preg.lmp,w*7),'10:00'),t('nWeekT',w),w>=4?t('sizeOf',i.fruit):i.baby,{mode:'preg',tab:'home'})}
    if(n.appt)S.preg.appts.forEach((a,k)=>{if(k>40)return;push(3100+k*2,atT(add(a.date,-1),'20:00'),t('nApptT'),t('nApptB1',a.title,a.time),{mode:'preg',tab:'appts'});
      if(a.time)push(3101+k*2,new Date(+atT(a.date,a.time)-2*3600e3),t('nApptT'),t('nApptB2',a.title,a.time),{mode:'preg',tab:'appts'})});
    if(n.kicks&&p.w>=27)for(let i=0;i<14;i++)push(3300+i,atT(add(TODAY,i),n.kickTime),t('nKickT'),t('nKickB'),{mode:'preg',tab:'tools'});
  }
  if(S.mode==='pp'&&S.pp&&S.pp.birth&&!S.pp.sample){const P=S.pp;
    if(n.vacc)VACC.forEach((v,k)=>{if(P.vacc[v[0]])return;const due=addMonths(P.birth,v[1]),nm=L2([v[2],v[3]]);
      push(4000+k*2,atT(add(due,-3),'10:00'),t('nVaccT'),t('nVaccB3',nm),{mode:'pp',tab:'vacc'});push(4001+k*2,atT(due,'09:00'),t('nVaccT'),t('nVaccB0',nm),{mode:'pp',tab:'vacc'})});
    if(n.feed&&!P.feedActive){const lf=lastFeed();if(lf)push(4100,new Date(lf.end+(+n.feedGap||3)*3600e3),t('nFeedT'),t('nFeedB',+n.feedGap||3),{mode:'pp',tab:'feed'})}
  }
  if(n.ramadan){const nr=nextRamadan(),q=qadaLeft();if(nr&&q>0)push(5000,atT(add(nr,-7),'20:00'),t('nRamT'),t('nRamB',q),{tab:'more'})}
  return out.slice(0,400);
}
let NTO=null;
function scheduleSoon(){if(!NATIVE)return;clearTimeout(NTO);NTO=setTimeout(reschedule,1200)}
async function reschedule(){
  const LN=CP.LocalNotifications;if(!LN||U.decoy)return;
  try{
    const pend=await LN.getPending();if(pend&&pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(x=>({id:x.id}))});
    if(!NS().on)return;const perm=await LN.checkPermissions();if(perm.display!=='granted')return;
    const list=buildNotifs();if(list.length)await LN.schedule({notifications:list});
  }catch(e){}
}
const _saveBase=save;save=function(){_saveBase();scheduleSoon()};

/* files: write to the app cache and open Android's share sheet (no storage permission needed) */
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
const _saveFileBase=saveFile;
saveFile=async function(name,data){
  if(!NATIVE)return _saveFileBase(name,data);
  const FS=CP.Filesystem,SH=CP.Share;if(!FS||!SH)throw {code:'unavailable'};
  const w=data instanceof Blob?await FS.writeFile({path:name,data:await blobB64(data),directory:'CACHE'}):await FS.writeFile({path:name,data:String(data),directory:'CACHE',encoding:'utf8'});
  try{await SH.share({title:name,url:w.uri,dialogTitle:name})}catch(e){throw {code:'declined'}}
  return 'saved';
};

/* settings card */
function notifCard(){
  const n=NS();
  if(!NATIVE)return `<section class="card">${ch('bell','teal',t('notifT'))}<p class="small muted">${t('notifWeb')}</p></section>`;
  const tg=(k,l)=>`<label class="check" for="nt-${k}"><input type="checkbox" id="nt-${k}" data-nt="${k}" ${n[k]?'checked':''}><span>${t(l)}</span></label>`;
  const ti=k=>`<label for="nt-${k}" class="tin">${t('ntTime')}<input type="time" id="nt-${k}" data-ntv="${k}" value="${esc(n[k])}"></label>`;
  return `<section class="card">${ch('bell','teal',t('notifT'))}
    <div class="row"><button class="${n.on?'':'primary'}" data-act="notifOn">${n.on?t('notifOff'):t('notifEnable')}</button>${n.on?`<button data-act="notifTest">${t('notifTest')}</button>`:''}</div>
    <p class="note" id="nmsg">${esc(U.nMsg||'')}</p>
    ${n.on?`<div class="ngroups">
      <div class="inset"><h3>${t('modeCycle')}</h3>${tg('period','ntPeriod')}${tg('fert','ntFert')}${tg('late','ntLate')}${tg('journal','ntJournal')}${n.journal?ti('journalTime'):''}</div>
      <div class="inset"><h3>${t('nDaily')}</h3>${tg('meds','ntMeds')}${n.meds?ti('medTime'):''}${tg('water','ntWater')}</div>
      <div class="inset"><h3>${t('modePreg')}</h3>${tg('week','ntWeek')}${tg('appt','ntAppt')}${tg('kicks','ntKicks')}${n.kicks?ti('kickTime'):''}</div>
      <div class="inset"><h3>${t('modePP')}</h3>${tg('vacc','ntVacc')}${tg('feed','ntFeed')}${n.feed?`<label for="nt-gap" class="tin">${t('ntGap')}<input type="number" id="nt-gap" data-ntv="feedGap" min="1" max="6" value="${n.feedGap}"></label>`:''}</div>
      <div class="inset"><h3>${t('nOther')}</h3>${tg('ramadan','ntRam')}${tg('hide','ntHide')}</div></div><p class="note">${t('notifNote')}</p>`:''}</section>`;
}
const _vSetBase=vSet;
vSet=function(){const mk=`<section class="card"><h2>${t('lockT')}</h2>`,h=_vSetBase();return h.includes(mk)?h.replace(mk,notifCard()+mk):h+notifCard()};
SUB.set=vSet;
vMore=(f=>function(){const h=f();return NATIVE?h.replace(/<button class="mtile tone-teal" data-mgo="ai">[\s\S]*?<\/button>/,''):h})(vMore);

document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset.act;if(a!=='notifOn'&&a!=='notifTest')return;
  const LN=CP.LocalNotifications;if(!LN)return;const n=NS();
  if(a==='notifOn'){
    if(n.on){n.on=false;U.nMsg='';save();render();return}
    try{let p=await LN.checkPermissions();if(p.display!=='granted')p=await LN.requestPermissions();
      if(p.display==='granted'){n.on=true;U.nMsg=t('notifOnMsg')}else U.nMsg=t('notifDenied')}catch(err){U.nMsg=t('notifDenied')}
    save();render();return;
  }
  try{await LN.schedule({notifications:[{id:9999,title:t('nTestT'),body:t('nTestB'),schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true},channelId:'zahra',smallIcon:'ic_stat_zahra',iconColor:accentHex()}]});U.nMsg=t('testSent')}catch(err){U.nMsg=t('notifDenied')}
  const m=document.getElementById('nmsg');if(m)m.textContent=U.nMsg;
});
document.addEventListener('change',e=>{
  const x=e.target,k=x.dataset&&(x.dataset.nt||x.dataset.ntv);if(!k)return;const n=NS();
  if(x.dataset.nt)n[k]=x.checked;else n[k]=k==='feedGap'?Math.max(1,Math.min(6,+x.value||3)):x.value;
  save();render();
});
if(NATIVE){
  const LN=CP.LocalNotifications,AP=CP.App;
  try{LN&&LN.createChannel({id:'zahra',name:'Zahra',description:'Reminders',importance:4,visibility:0,vibration:true})}catch(e){}
  try{LN&&LN.addListener('localNotificationActionPerformed',ev=>{const x=(ev&&ev.notification&&ev.notification.extra)||{};if(x.mode&&VIEWS[x.mode])S.mode=x.mode;if(x.tab)U.tab[S.mode]=x.tab;U.more=null;render()})}catch(e){}
  try{AP&&AP.addListener('backButton',()=>{if(U.ob||(S.lock.pin&&!U.unlocked)){AP.exitApp();return}if(U.more){U.more=null;render();return}if(U.tab[S.mode]!=='home'){go('home');return}AP.exitApp()})}catch(e){}
  try{AP&&AP.addListener('resume',()=>{if(fd(new Date())!==TODAY)location.reload();else scheduleSoon()})}catch(e){}
  setTimeout(reschedule,2500);
}

render();
