name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Prepare app files
        run: npm run build:web
      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
      - name: Use the project's fixed signing key (updates install over the previous version)
        run: mkdir -p ~/.android && cp keys/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: zahra-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
